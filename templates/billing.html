<form method="POST">
    {% csrf_token %}

    <label>Product:</label>
    <select name="product" required>
        {% for product in products %}
        <option value="{{ product.id }}">
            {{ product.name }}
        </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Quantity:</label>
    <input type="number" name="quantity" required>

    <br><br>

    <button type="submit">Generate Bill</button>
</form>
